<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: "Fraunces"; src: url("../assets/fonts/fraunces-normal.woff2") format("woff2"); font-weight: 300 800; }
  @font-face { font-family: "Fraunces"; src: url("../assets/fonts/fraunces-italic.woff2") format("woff2"); font-weight: 300 800; font-style: italic; }
  @font-face { font-family: "Inter"; src: url("../assets/fonts/inter-normal.woff2") format("woff2"); font-weight: 400 700; }
  html, body { margin: 0; }
  .og { position: relative; width: 1200px; height: 630px; overflow: hidden; background: radial-gradient(900px 600px at 75% 40%, #1A1E26, #0E1014 70%); color: #E9E3D3; font-family: "Inter", sans-serif; }
  .blob { position: absolute; left: 760px; top: 70px; width: 440px; height: 440px; border-radius: 47% 53% 50% 50% / 52% 46% 54% 48%; background: #F2A93B; box-shadow: 0 0 0 3px #0E1014, 0 0 0 5px #F3EEDD; }
  img { position: absolute; left: 800px; top: 60px; height: 640px; }
  .copy { position: absolute; left: 72px; top: 96px; }
  h1 { margin: 0; font: 600 108px/.92 "Fraunces", serif; letter-spacing: -3px; color: #F3EEDD; font-variation-settings: "opsz" 144; }
  h1 em { font-weight: 500; color: #F2A93B; }
  p { margin: 26px 0 0; font-size: 28px; font-weight: 500; }
  .stats { display: flex; gap: 16px; margin-top: 40px; }
  .stats div { padding: 14px 20px; border: 2px solid rgba(243,238,221,.18); border-radius: 16px; font-size: 20px; color: #A7A196; }
  .stats b { display: block; font: 600 40px/1 "Fraunces", serif; color: #F3EEDD; margin-bottom: 4px; }
  .url { position: absolute; left: 72px; bottom: 54px; font-size: 22px; color: #F2A93B; font-weight: 600; letter-spacing: .3px; }
</style></head>
<body><div class="og">
  <div class="blob"></div>
  <img src="../assets/hemanshi.webp" alt="">
  <div class="copy">
    <h1>Hemanshi<br><em>Dubey</em></h1>
    <p>B2B Sales &amp; Key Account Manager</p>
    <div class="stats"><div><b>88%</b>quota attainment</div><div><b>70%</b>client retention</div><div><b>2+ yrs</b>B2B sales</div></div>
  </div>
  <div class="url">hemanshiportfolio-mxp3.vercel.app</div>
</div></body></html>
